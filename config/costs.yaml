currency: INR

# IEEE-CIS TransactionAmt is denominated in USD -- the competition host states
# this explicitly. Median $68.77, mean $135.03 across 590,540 rows. Treating
# those numbers as rupees silently understates every disputed amount by ~83x,
# which makes a Rs 750 contest fee exceed the disputed amount for 98% of rows
# and makes the rules baseline fire on 2 of 590,540.
#
# This is a STATED CONVERSION, not a measurement: IEEE-CIS is US card data, so
# there is no Indian ground truth here. The rate is a round approximation of
# the 2026 USD/INR range, held as a single published constant so every rupee
# figure in the README can be divided back out by a reader who disagrees with
# it. The sensitivity sweep exists partly for this reason.
usd_to_inr: 83.0

# Verified priors (checked 2026-08-31). Do not edit without re-checking sources.
#   Fraud-coded representment win rate: 17.1%  (chargeback.io 2026)
#   Overall representment win rate:     41-54% (source-dependent; Chargebacks911 says 54% US)
#   Net recovery rate:                  10.7%  (merchants win 43.8% of what they
#                                       represent but net-recover only 10.7% after
#                                       second-cycle disputes and undetected friendly fraud)
#   Total cost multiplier:              $5.13 per $1 of fraud loss (LexisNexis
#                                       True Cost of Fraud 2026 -- NOT $4.61, which is 2025)
#   First-party misuse share of chargebacks: 40-75%, source- and definition-dependent.
#                                       DO NOT assert 43.8% -- that number appears in
#                                       Chargebacks911 material as the representment WIN RATE,
#                                       a different statistic. Cite the range only.

# Published priors. Sources are mandatory; see README Prior Art.
base_win_rate_fraud_coded: 0.171   # verified: chargeback.io 2026 compilation.
                                   # Fraud-coded representment win rate, vs 41-54% overall.
lift_clip: [0.5, 2.5]              # bounds on model-score influence over the base rate

# Rs 750 = top of the most commonly cited India-specific band (Rs 200-750).
# The wider Rs 500-2000 and global Rs 1500-8000 figures describe large merchants
# and other geographies. Choosing the high end of the India band is deliberately
# CONSERVATIVE: a higher contest fee makes contesting less attractive, so the
# model's measured benefit is understated rather than inflated.
# Razorpay does NOT publish a dispute fee -- razorpay.com/pricing lists transaction
# and refund fees only, and the fee is negotiated per merchant agreement and charged
# win or lose. This is why the threshold sensitivity sweep is methodologically
# required, not decorative: we report the decision boundary across the range.
contest_fee_inr: 750.0
ops_cost_inr: 250.0                # PLACEHOLDER - staff time per contested dispute
decision_margin_inr: 100.0         # REVIEW band half-width

# Expected exposure (P(chargeback) x amount) at which each posture turns on.
# These are the vault's policy dial and are REPORTED, so they belong in config
# with the other published assumptions -- not as literals inside store.py.
# Compare against posture_cost_inr below: we spend Rs 12 once Rs 50 is at risk,
# and Rs 75 once Rs 500 is at risk.
posture_thresholds_inr:
  PASSIVE: 50.0
  ACTIVE: 500.0

posture_cost_inr:
  NONE: 0.0
  PASSIVE: 12.0                    # PLACEHOLDER - storage/logging per transaction
  ACTIVE: 75.0                     # PLACEHOLDER - signature on delivery etc.

completeness:
  missing_required_penalty: 0.45   # multiplied per missing required field
  supporting_bonus: 1.08           # multiplied per present supporting field

reason_codes:
  fraud_card_absent:
    label: "Fraud - card absent environment"
    required: [billing_proof, shipping_proof]
    supporting: [customer_communication, access_activity_log, term_and_conditions]

# Hand-written rules baseline. Reported alongside the model, so these thresholds
# are part of the published methodology, not implementation detail.
baseline_rules:
  # Rs 10,000 ~ USD 120, just above the USD 68.77 median: a plausible
  # "large transaction" rule. Against UNCONVERTED dollar amounts this fired on
  # 2 rows in 590,540 and the baseline was degenerate.
  amount_inr: 10000.0
  dist: 100.0
